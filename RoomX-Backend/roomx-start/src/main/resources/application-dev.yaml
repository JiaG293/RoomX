server:
  port: ${SERVER_PORT:8888}
  servlet: # sửa lỗi font tiếng việt
    encoding:
      charset: UTF-8
      enabled: true
      force: true
#  servlet:
#    context-path: /api
#  tomcat:
#    threads:
#      max: 100
#      min-spare: 50
#    accept-count: 20000
spring:
  messages: # Cấu hình message chuận utf8 tránh lỗi font tiếng việt
    encoding: UTF-8
  flyway:
    baseline-on-migrate: true
    locations: classpath:db/migration/default
    schemas: public
    enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:roomx}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
    dbcp2: # Các connection qua pool mặc định  sẽ đi vào đây
#      default-schema: ${DB_SCHEMA_DBCP2:schema_roomx}
    hikari: # Nếu không chỉ định schema thì các truy vấn mặc định sẽ đi vào đây
#      schema: ${DB_SCHEMA_HIKARI:schema_roomx}
      maximum-pool-size: 20   # Số lượng tối đa kết nối
      minimum-idle: 5         # Số lượng kết nối tối thiểu trong pool
    type: com.zaxxer.hikari.HikariDataSource
  jpa:
    database: postgresql
    show-sql: true
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    properties: # Nếu hibernate không tìm thấy schema mặc định sẽ đi vào đây (cấp thấp hơn hikari)
      hibernate:
        format_sql: true
        use_sql_comments: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          auto: update # không bật trong production
      #      default_schema: ${DB_SCHEMA_HIBERNATE:DEFAULT}
      defer-datasource-initialization: true   # Ngăn insert dữ liệu trước khi jpa mapping
  jackson:
    serialization:
      indent-output: true
    deserialization:
      fail-on-unknown-properties: true
#  sql:
#    init:
#      mode: ${SQL_INIT_MODE:never}
#      data-locations: ${SQL_INIT_DATA:classpath:database/data.sql}  # SQL native thêm dữ liệu
#      schema-locations: ${SQL_INIT_SCHEMA:classpath:database/schema.sql} # SQL native tạo schema
#  security:
#    oauth2:
#      resourceserver:
#        jwt:
#          issuer-uri: ${OAUTH2_RESOURCESERVER_JWT_ISSUER:http://localhost:5555/realms/roomx}
#          jwk-set-uri: ${OAUTH2_RESOURCESERVER_JWT_JWK:http://localhost:5555/realms/roomx/protocol/openid-connect/certs}
  mail:
    port: 587
    host: ${MAIL_HOST:smtp.gmail.com}
    username: ${MAIL_USERNAME:unknown@gmail.com}
    password: ${MAIL_PASSWORD:unknown}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            trust: ${MAIL_DOMAIN_SSL:smtp.gmail.com}

resilience4j:
  ratelimiter:
    instances:
      test1:
        limitForPeriod: 2
        limitRefreshPeriod: 10s
        timeoutDuration: 0
        registerHealthIndicator: true
        eventConsumerBufferSize: 100
      test2:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 3s
  circuitbreaker:
    instances:
      test3:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        #        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 20
        waitDurationInOpenState: 50s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

      test4:
        registerHealthIndicator: true
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 3
        #        slidingWindowType: TIME_BASED
        minimumNumberOfCalls: 5
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
keycloak:
  client-default: ${KEYCLOAK_CLIENT_DEFAULT:roomx-fe} # client mặc định cho app roomx
  realm: master
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:http://localhost:5555} # địa chỉ của keycloak server
  resource: ${KEYCLOAK_RESOURCE:roomx-backend-admin} # Client ID của ứng dụng liên lạc với backend
  credentials:
    secret: ${KEYCLOAK_CREDENTIALS_SECRET:NE5P98sS61cQ8bBBofe4kveX8rUEZ7Hy}
  use-resource-role-mappings: true
  bearer-only: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG

multitenancy:
  tenants:
    - identifier: giau
      enabled: true
      schema: giau
      issuer: http://192.168.1.251:5555/realms/giau
    - identifier: sang
      enabled: true
      schema: sang
      issuer: http://192.168.1.251:5555/realms/sang
    - identifier: hiep
      enabled: true
      schema: hiep
      issuer: http://192.168.1.251:5555/realms/hiep