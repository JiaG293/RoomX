networks:
  roomx_network:
    name: roomx_network
    external: true
services:
  # NGINX PROXY
  nginx:
    image: nginx:latest
    container_name: nginx_roomx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/html:/usr/share/nginx/html
      #- ./platform/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/letsencrypt
    networks:
      - roomx_network

  #CERTBOT SSL Certificate
  certbot:
    image: certbot/certbot
    container_name: certbot_roomx
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./nginx/html:/usr/share/nginx/html
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /usr/share/nginx/html --quiet --no-self-upgrade;
        nginx -s reload;
        sleep 1d & wait $${!};
      done;"